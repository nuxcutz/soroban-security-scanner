name: merge-recon
on:
  workflow_dispatch:
    inputs:
      feature_branch:
        required: true
        default: feat/type-env-metrics
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.feature_branch }}
          fetch-depth: 0
      - name: merge and capture conflicts
        run: |
          git config user.name "merge-assist"
          git config user.email "merge-assist@users.noreply.github.com"
          git remote add upstream https://github.com/StellarFoundry/soroban-security-scanner.git
          git fetch upstream main
          git merge --no-commit upstream/main || true
          echo "=== CONFLICTS ==="
          git diff --name-only --diff-filter=U | tee conflicts.txt
          echo "=== STATUS ==="
          git status --short || true
          mkdir -p artifact
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            d="artifact/$(dirname "$f")"; mkdir -p "$d"
            git show ":1:$f" > "artifact/$f.base" 2>/dev/null || true
            git show ":2:$f" > "artifact/$f.ours" 2>/dev/null || true
            git show ":3:$f" > "artifact/$f.theirs" 2>/dev/null || true
          done < conflicts.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conflict-data
          path: |
            conflicts.txt
            artifact
          if-no-files-found: ignore